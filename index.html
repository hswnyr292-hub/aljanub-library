<!DOCTYPE html>

  <title>مكتبة الجنوب | Al Janub Library</title>
  <style>
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0; min-height: 100vh; padding: 24px 14px;
      display: flex; align-items: center; justify-content: center;
      font-family: Tahoma, Arial, sans-serif; color: #fff;
      background: radial-gradient(ellipse at top, #44351a 0%, #171512 48%, #080808 100%);
      overflow-wrap: anywhere;
    }
    .card {
      width: 100%; max-width: 430px; min-width: 0; padding: 28px 22px;
      text-align: center; background: #111;
      border: 1px solid #d4af37; border-radius: 24px;
      box-shadow: 0 12px 42px rgba(0,0,0,.45), 0 0 24px rgba(212,175,55,.10);
      overflow: hidden;
    }
    .logo-frame {
      width: min(190px, 65vw); aspect-ratio: 1 / 1;
      margin: 0 auto 22px; padding: 5px; border: 2px solid #d4af37;
      border-radius: 50%; background: #080808; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 20px rgba(212,175,55,.15);
    }
    .logo-frame img { display: block; width: 100%; height: 100%; object-fit: contain; border-radius: 50%; }
    h1 { margin: 0 0 5px; color: #f5e8c5; font-size: clamp(20px, 5vw, 24px); line-height: 1.7; }
    .library-name { margin: 0 0 7px; color: #e6bd4a; font-size: clamp(27px, 7vw, 34px); font-weight: 800; line-height: 1.6; }
    .subtitle { margin: 0 0 22px; color: #d0d0d0; font-size: 14px; line-height: 1.9; }
    .divider { width: 78%; height: 1px; margin: 18px auto; background: linear-gradient(to left, transparent, #d4af37, transparent); }
    .social-button {
      width: 100%; min-height: 62px; margin: 10px 0; padding: 14px 12px;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      border: 1px solid rgba(255,255,255,.15); border-radius: 14px;
      color: #fff; text-decoration: none; font-size: 16px; font-weight: bold;
      line-height: 1.5; transition: transform .2s, filter .2s;
    }
    .social-button:hover { transform: translateY(-2px); filter: brightness(1.08); }
    .social-button:focus-visible { outline: 3px solid #e6bd4a; outline-offset: 3px; }
    .social-button svg { width: 28px; height: 28px; flex: 0 0 28px; fill: currentColor; }
    .whatsapp { background: linear-gradient(135deg, #20c767, #087c43); }
    .telegram { background: linear-gradient(135deg, #28a8e9, #0966b5); }
    footer { margin-top: 20px; color: #bdbdbd; font-size: 12px; line-height: 2; }
    footer span { color: #d4af37; }
    @media (max-width: 360px) { .card { padding: 23px 15px; } .social-button { font-size: 14px; } }
